<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSocket Messenger</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .app {
    width: min(900px, 95vw);
    height: min(640px, 92vh);
    display: flex;
    border-radius: 14px;
    overflow: hidden;
    background: #1e293b;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }
  .sidebar {
    width: 180px;
    background: #0f172a;
    padding: 18px 14px;
    border-right: 1px solid #334155;
  }
  .sidebar h2 {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #64748b;
    margin-bottom: 10px;
  }
  .sidebar ul { list-style: none; }
  .sidebar li {
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: #1e293b;
    font-size: .9rem;
  }
  .sidebar li.me { background: #2563eb; }
  .chat { flex: 1; display: flex; flex-direction: column; }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid #334155;
  }
  header h1 { font-size: 1rem; font-weight: 600; }
  .dot { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: #94a3b8; }
  .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
  .dot.on::before { background: #22c55e; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: .92rem;
    line-height: 1.35;
    word-break: break-word;
  }
  .row b { font-weight: 600; }
  .row .time { font-size: .7rem; color: #94a3b8; margin-left: 6px; }
  .row.system {
    align-self: center;
    background: transparent;
    color: #64748b;
    font-style: italic;
    font-size: .82rem;
    text-align: center;
    max-width: 90%;
  }
  .row.error { align-self: center; background: #7f1d1d; color: #fecaca; font-size: .82rem; }
  .row.public { align-self: flex-start; background: #1d4ed8; }
  .row.private { align-self: flex-start; background: #6d28d9; }
  .row.mine { align-self: flex-end; }
  #composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #334155; }
  #composer select, #composer input, #composer button, .card input, .card button {
    font: inherit;
    color: inherit;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 9px 12px;
    outline: none;
  }
  #text { flex: 1; }
  #composer button, .card button {
    background: #2563eb;
    border-color: #2563eb;
    cursor: pointer;
  }
  #composer button:hover, .card button:hover { background: #1d4ed8; }
  #composer select { cursor: pointer; }
  #target { width: 130px; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, .75);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    padding: 26px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 300px;
  }
  .card h2 { font-size: 1.05rem; }
  .card p { color: #f87171; font-size: .82rem; min-height: 1em; }
</style>
</head>
<body>
<main class="app">
  <aside class="sidebar">
    <h2>Online</h2>
    <ul id="users"></ul>
  </aside>
  <section class="chat">
    <header>
      <h1>WebSocket Messenger</h1>
      <span id="status" class="dot">offline</span>
      <span id="me" style="margin-left:auto; font-size:.85rem; color:#64748b"></span>
    </header>
    <div id="log"></div>
    <form id="composer">
      <select id="scope">
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>
      <input id="target" placeholder="to (username)" hidden>
      <input id="text" placeholder="Type a message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
</main>

<div id="login" class="modal">
  <div class="card">
    <h2>Join the chat</h2>
    <input id="username" placeholder="Pick a username" autocomplete="off">
    <button id="join">Connect</button>
    <p id="login-error"></p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws = null;
let me = "";

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function addRow(html, cls) {
  const div = document.createElement("div");
  div.className = "row " + cls;
  div.innerHTML = html;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

function renderUsers(users) {
  $("users").innerHTML = users
    .map((u) => `<li class="${u === me ? "me" : ""}">${escapeHtml(u)}</li>`)
    .join("");
}

function onMessage(raw) {
  const m = JSON.parse(raw.data);
  if (m.type === "system") {
    addRow(`<span class="time">${escapeHtml(m.time)}</span> ${escapeHtml(m.text)}`, "system");
    renderUsers(m.users || []);
  } else if (m.type === "error") {
    addRow(`Error: ${escapeHtml(m.text)}`, "error");
  } else if (m.type === "message") {
    const cls = (m.from === me ? "mine " : "") + m.scope;
    const who = m.from === me ? "you" : m.from;
    const to = m.scope === "private" ? " -> " + m.to : "";
    addRow(
      `<b>${escapeHtml(who + to)}:</b> ${escapeHtml(m.text)}<span class="time">${escapeHtml(m.time)}</span>`,
      cls
    );
  }
}

function connect(name) {
  ws = new WebSocket(`ws://${location.host}/ws/${name}`);
  ws.onopen = () => {
    me = name;
    $("login").style.display = "none";
    $("status").classList.add("on");
    $("status").textContent = "online";
    $("me").textContent = "you are " + name;
    $("text").focus();
  };
  ws.onmessage = onMessage;
  ws.onclose = (e) => {
    ws = null;
    $("status").classList.remove("on");
    $("status").textContent = "offline";
    $("me").textContent = "";
    renderUsers([]);
    $("login").style.display = "flex";
    $("login-error").textContent =
      e.code === 4001 ? e.reason : "Connection closed (code " + e.code + ")";
  };
}

$("join").onclick = () => {
  const name = $("username").value.trim();
  if (!name) return;
  $("login-error").textContent = "";
  connect(name);
};
$("username").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("join").click();
});

$("scope").onchange = () => {
  $("target").hidden = $("scope").value !== "private";
  if (!$("target").hidden) $("target").focus();
};

$("composer").onsubmit = (e) => {
  e.preventDefault();
  if (!ws) return;
  const scope = $("scope").value;
  const text = $("text").value.trim();
  if (!text) return;
  const payload = { type: scope, text };
  if (scope === "private") {
    const to = $("target").value.trim();
    if (!to) return;
    payload.to = to;
  }
  ws.send(JSON.stringify(payload));
  $("text").value = "";
  $("text").focus();
};
</script>
</body>
</html>
